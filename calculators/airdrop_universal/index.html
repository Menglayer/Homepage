
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="menglayer-source" content="https://airdropestimator.menglayer.cc/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通用空投估算器 | 萌芽社区</title>
  <meta name="description" content="输入积分总量/我的积分/FDV/空投比例，估算 1 分价值与我的空投价值。包含中英切换与关注后解锁。">
  <style>
    :root{
      --bg1:#eaf7ff; --bg2:#ffffff; --brand:#357ef3; --brand-dark:#2b66cc;
      --text:#0f172a; --muted:#64748b; --border:#e5e7eb; --card:rgba(255,255,255,0.85);
      --shadow: 0 8px 30px rgba(53,126,243,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji;
      margin:0; color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, #b7e1ff55, transparent),
                  linear-gradient(180deg, #e6f5ff 0%, #f7fbff 100%);
      min-height:100vh;
    }
    .container{max-width:980px;margin:32px auto;padding:0 16px}
    .header{
      display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px;
    }
    .title{font-size:22px; font-weight:800}
    .lang{
      display:flex; gap:8px; align-items:center;
      border:1px solid var(--border); border-radius:12px; padding:6px 10px; background:var(--bg2)
    }
    .lang button{border:0;background:transparent;color:var(--muted);cursor:pointer}
    .lang button.active{color:var(--brand);font-weight:700}
    .card{
      background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow);
      padding:18px; margin-bottom:18px;
    }
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px}
    @media (max-width:860px){ .grid{grid-template-columns:1fr} }
    label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
    input,select{
      width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); outline:none; font-size:14px; background:var(--bg2)
    }
    .hint{font-size:12px;color:var(--muted)}
    .result{
      position:relative; overflow:hidden;
      background:linear-gradient(180deg,#fff, #f8fbff);
      border:1px solid var(--border); border-radius:20px; padding:18px;
    }
    .rgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
    @media (max-width:860px){ .rgrid{grid-template-columns:1fr} }
    .metric{
      border:1px dashed var(--border); border-radius:14px; padding:14px; background:#fff;
    }
    .metric .v{font-size:22px; font-weight:800}
    .metric .k{font-size:13px; color:var(--muted)}
    .unlock{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      backdrop-filter: blur(6px); background:linear-gradient(180deg,#ffffffbb,#ffffffee);
    }
    .btn{
      display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px;
      border:1px solid var(--brand); color:white; background:var(--brand); cursor:pointer; font-weight:700;
    }
    .btn.subtle{background:#fff;color:var(--brand)}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .footer{margin-top:10px; font-size:12px; color:var(--muted)}
  </style>
<link rel="stylesheet" href="../../assets/css/calculator-theme.css"><script defer src="../../assets/js/calculator-bridge.js"></script></head>
<body>
  <div class="container">
    <div class="header">
      <div class="title" data-i18n="title">通用空投估算器</div>
      <div class="row">
        <button class="btn subtle" id="followBtn" data-i18n="follow">关注我 X（点击解锁结果）</button>
        <div class="lang">
          <button id="zhBtn" class="active">中文</button>
          <span>|</span>
          <button id="enBtn">EN</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label data-i18n="totalPoints">积分总量（Total Points）</label>
          <input id="totalPoints" type="number" placeholder="例如：100000000" value="100000000" />
        </div>
        <div>
          <label data-i18n="myPoints">我的积分（My Points）</label>
          <input id="myPoints" type="number" placeholder="例如：20000" value="20000" />
        </div>
        <div>
          <label data-i18n="fdv">FDV（Fully Diluted Valuation / USD）</label>
          <input id="fdv" type="number" placeholder="5000000000" value="5000000000" />
          <div class="hint" data-i18n="fdvHint">默认 5B，随时可改</div>
        </div>
        <div>
          <label data-i18n="airdropPct">空投比例（Airdrop %）</label>
          <input id="airdropPct" type="number" placeholder="10" value="10" />
        </div>
      </div>
    </div>

    <div class="result" id="resultCard">
      <div class="rgrid">
        <div class="metric">
          <div class="k" data-i18n="ppv">1 分的预测价值</div>
          <div class="v" id="perPointValue">$0.00</div>
        </div>
        <div class="metric">
          <div class="k" data-i18n="myShare">我的占比</div>
          <div class="v" id="myShare">0.00%</div>
        </div>
        <div class="metric">
          <div class="k" data-i18n="myAirdrop">我的空投价值（$）</div>
          <div class="v" id="myAirdropValue">$0.00</div>
        </div>
      </div>

      <div class="unlock" id="unlockLayer">
        <div class="row">
          <button class="btn" id="unlockBtn" data-i18n="unlock">关注 @menglayer 后解锁</button>
          <button class="btn subtle" id="previewBtn" data-i18n="preview">先预览示例</button>
        </div>
      </div>
    </div>

    <div class="footer" data-i18n="note">
      说明：1分价值 = FDV × 空投比例 ÷ 积分总量。我的空投价值 = 1分价值 × 我的积分。仅为估算，非投资建议。
    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const nf = new Intl.NumberFormat('en-US', {maximumFractionDigits: 6});
    const money = (v)=> isFinite(v) ? '$' + nf.format(v) : '-';

    const i18n = {
      "zh-CN": {
        title:"通用空投估算器",
        follow:"关注我 X（点击解锁结果）",
        totalPoints:"积分总量（Total Points）",
        myPoints:"我的积分（My Points）",
        fdv:"FDV（Fully Diluted Valuation / USD）",
        fdvHint:"默认 5B，随时可改",
        airdropPct:"空投比例（Airdrop %）",
        ppv:"1 分的预测价值",
        myShare:"我的占比",
        myAirdrop:"我的空投价值（$）",
        unlock:"关注 @menglayer 后解锁",
        preview:"先预览示例",
        note:"说明：1分价值 = FDV × 空投比例 ÷ 积分总量。我的空投价值 = 1分价值 × 我的积分。仅为估算，非投资建议。"
      },
      "en": {
        title:"Universal Airdrop Estimator",
        follow:"Follow me on X (unlock results)",
        totalPoints:"Total Points",
        myPoints:"My Points",
        fdv:"FDV (Fully Diluted Valuation / USD)",
        fdvHint:"Default 5B, editable",
        airdropPct:"Airdrop Percentage (%)",
        ppv:"Estimated value per point",
        myShare:"My share",
        myAirdrop:"My airdrop value ($)",
        unlock:"Follow @menglayer to unlock",
        preview:"Preview sample",
        note:"Formula: 1-pt value = FDV × Airdrop% ÷ Total Points. My airdrop value = 1-pt value × My Points. Estimation only."
      }
    };

    function setLang(lang){
      const dict = i18n[lang] || i18n["zh-CN"];
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(dict[k]) el.textContent = dict[k];
      });
      document.querySelector("#zhBtn").classList.toggle("active", lang === "zh-CN");
      document.querySelector("#enBtn").classList.toggle("active", lang === "en");
      localStorage.setItem("lang", lang);
    }

    function calc(){
      const total = parseFloat($("totalPoints").value);
      const mine  = parseFloat($("myPoints").value);
      const fdv   = parseFloat($("fdv").value);
      const pct   = parseFloat($("airdropPct").value)/100;

      if(isFinite(total) && total>0 && isFinite(fdv) && isFinite(pct)){
        const per = fdv * pct / total;
        $("perPointValue").textContent = money(per);
        const share = isFinite(mine) && mine>0 ? (mine/total*100) : 0;
        $("myShare").textContent = nf.format(share) + "%";
        $("myAirdropValue").textContent = money(per * (isFinite(mine)?mine:0));
      }else{
        $("perPointValue").textContent = "$0.00";
        $("myShare").textContent = "0%";
        $("myAirdropValue").textContent = "$0.00";
      }
    }

    ["totalPoints","myPoints","fdv","airdropPct"].forEach(id=>{
      $(id).addEventListener("input", calc);
    });

    // Follow gate
    const unlockLayer = $("unlockLayer");
    function refreshGate(){
      const ok = localStorage.getItem("follow_x_ok") === "1";
      unlockLayer.style.display = ok ? "none":"flex";
    }
    refreshGate();

    $("unlockBtn").addEventListener("click", ()=>{
      localStorage.setItem("follow_x_ok","1");
      window.open("https://x.com/menglayer","_blank");
      refreshGate();
    });

    $("followBtn").addEventListener("click", ()=>{
      localStorage.setItem("follow_x_ok","1");
      window.open("https://x.com/menglayer","_blank");
      refreshGate();
    });

    $("previewBtn").addEventListener("click", ()=>{
      localStorage.setItem("follow_x_ok","1");
      refreshGate();
    });

    // i18n init
    const initLang = localStorage.getItem("lang") || "zh-CN";
    setLang(initLang);
    $("zhBtn").addEventListener("click", ()=>setLang("zh-CN"));
    $("enBtn").addEventListener("click", ()=>setLang("en"));

    // first calc
    calc();
  </script>
</body>
</html>
